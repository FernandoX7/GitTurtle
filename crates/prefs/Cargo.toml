[package]
name = "gitturtle-prefs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Routes settings_path() into a per-thread isolated TestDirectory cleaned up on exit.
# Activated exclusively via [dev-dependencies] in downstream crates so production builds
# never touch test isolation code and enforce #![forbid(unsafe_code)].
test-support = ["dep:tempfile"]

[dependencies]
anyhow = "1"
gitturtle-core = { path = "../git-core" }
gitturtle-diff-model = { path = "../diff-model" }
gitturtle-theme = { path = "../theme" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
