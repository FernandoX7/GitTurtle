[package]
name = "gitturtle-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Git inspection and explicit everyday repository operations for GitTurtle"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
similar = "3.2"
sha2 = "0.11"
ignore = "=0.4.34"
thiserror = "2"

[features]
# `LfsDownloadPlan::stand_in`, for the app's tests, which cannot run Git LFS.
test-support = []

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "fs", "process"] }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3.27"
