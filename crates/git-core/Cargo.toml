[package]
name = "gitturtle-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Git inspection and explicit everyday repository operations for GitTurtle"

[dependencies]
anyhow = "1.0"
similar = "2.7"
sha2 = "0.10"
ignore = "=0.4.33"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "fs", "process"] }

[dev-dependencies]
tempfile = "3.27"
