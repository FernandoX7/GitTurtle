[package]
name = "gitturtle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
gpui-kit = { version = "=0.6.0", features = ["tree-sitter-diff", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-css", "tree-sitter-markdown", "tree-sitter-yaml", "tree-sitter-toml", "tree-sitter-html", "tree-sitter-python", "tree-sitter-go", "tree-sitter-bash"] }
gitturtle-core = { path = "../git-core" }
gitturtle-preview = { path = "../preview" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", features = ["debug-embed"] }
futures = "0.3"
notify = "=7.0.0"
tempfile = "3"
libc = "0.2"
markdown = "=1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[dev-dependencies]
gpui-kit = { version = "=0.6.0", features = ["test-support"] }

[[bin]]
name = "gitturtle"
path = "src/main.rs"
