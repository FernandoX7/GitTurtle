[package]
name = "gitturtle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gpui-kit = { version = "=0.6.0", features = ["tree-sitter-diff", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-css", "tree-sitter-markdown", "tree-sitter-yaml", "tree-sitter-toml", "tree-sitter-html", "tree-sitter-python", "tree-sitter-go", "tree-sitter-bash"] }
gitturtle-core = { path = "../git-core" }
gitturtle-preview = { path = "../preview" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
futures = "0.3"
notify = "=7.0.0"
tempfile = "3"
libc = "0.2"
markdown = "=1.0.0"
# Match the locked toolkit dependency for grapheme-safe message presentation.
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace", "NSAccessibility"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSNotification", "NSOperation", "NSString", "block2"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Reads the desktop's font antialiasing and text scaling through the XDG
# settings portal; the version matches the toolkit's own portal client.
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "settings"] }

[dev-dependencies]
gpui-kit = { version = "=0.6.0", features = ["test-support"] }

[[bin]]
name = "gitturtle"
path = "src/main.rs"
