[package]
name = "gitturtle-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Enables offline test fixtures/scripted transports and blocks live credential/network access.
# Activated exclusively via [dev-dependencies] in downstream crates.
test-support = []

[dependencies]
anyhow = "1"
gitturtle-core = { path = "../git-core" }
gitturtle-prefs = { path = "../prefs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
# WindowIdentifier parsing for Secret Service prompt parenting; matches oo7's locked ashpd.
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io"] }
futures = "0.3"
# The version and features match the toolkit's own oo7 client, so the shipped
# binary carries one copy of oo7 and its D-Bus stack.
oo7 = { version = "=0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
# Times the keyring calls' bounds; the reactor oo7 and the toolkit already run.
async-io = "=2.6.0"

[dev-dependencies]
gitturtle-prefs = { path = "../prefs", features = ["test-support"] }
