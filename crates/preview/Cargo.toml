[package]
name = "gitturtle-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded, in-memory image previews for GitTurtle"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
roxmltree = "0.21.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
meshopt = "=0.6.2"
ufbx = "0.11.5"
stl_io = "0.11.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

# Linux PDF pages, reachable only through `pdf_helper::serve` in GitTurtle's
# confined helper process, which supports x86-64 and AArch64. Embedded
# standard fonts and predefined CMaps keep the helper from reading system files.
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
hayro = { version = "=0.8.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }

[dev-dependencies]
tempfile = "3"
