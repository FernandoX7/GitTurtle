[package]
name = "gitturtle-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded, in-memory image previews for GitTurtle"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
roxmltree = "0.21"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
ufbx = "0.11.3"
stl_io = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
