[package]
name = "gitturtle-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded, in-memory image previews for GitTurtle"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
roxmltree = "0.21"

[dev-dependencies]
tempfile = "3"
