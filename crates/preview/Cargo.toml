[package]
name = "gitturtle-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded, in-memory image previews for GitTurtle"

[lints]
workspace = true

[dependencies]
anyhow = "1"
bytemuck = { version = "1.25", default-features = false }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
resvg = { version = "0.50.0", default-features = false, features = ["text", "system-fonts"] }
roxmltree = "0.21.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
meshopt = "=0.7.0"
ufbx = "0.11.5"
stl_io = "0.11.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

# Linux PDF pages and AVIF and JPEG 2000 images, reachable only through
# `pdf_helper::serve` in GitTurtle's confined helper process, which supports
# x86-64 and AArch64. Embedded standard fonts and predefined CMaps keep the
# helper from reading system files. `hayro-jpeg2000` stays at the version hayro
# uses and adds only its `image` integration. `mp4parse` is MPL-2.0 and used
# unmodified (its source ships in the notices). `libdav1d.so.7` is loaded
# dynamically at runtime via `dlopen` inside the helper before confinement
# (`src/dav1d_dlopen.rs`), avoiding a hard `DT_NEEDED` startup dependency on the
# main binary. `moxcms` is the version `image` and `hayro-jpeg2000` already use,
# direct only for converting an AVIF's or JPEG 2000's RGB ICC profile in
# `image_helper.rs`; it adds no features.
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
hayro = { version = "=0.9.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
hayro-jpeg2000 = { version = "=0.5.0", default-features = false, features = ["std", "simd", "image"] }
libc = "0.2"
mp4parse = "=0.17.0"
moxcms = { version = "=0.8.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["alloc", "NSData", "NSRange", "NSString"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFData", "CFDictionary", "CFNumber", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGPDFDocument", "CGPDFPage"] }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3"
