version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the composite actions pin their own steps.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    # Zero cooldown: propose GitHub Actions updates immediately (omitting
    # cooldown triggers GitHub's 3-day default). Actions are pinned by full
    # commit SHA and reviewed before merge.
    cooldown:
      default-days: 0
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
