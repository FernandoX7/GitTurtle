name: Website

# Quality owns PR/main routing. This callee only validates static inputs and
# never receives publication permissions or caller secrets.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-validation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  static:
    name: Static site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check local website inputs
        run: python3 website/check.py
      - name: Check JavaScript syntax
        run: node --check website/public/site.js
