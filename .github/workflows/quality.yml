name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  agent-tooling:
    name: Development tooling · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Python runtime
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11 or newer is required"'
      - name: Validate development guidance
        run: python3 scripts/ci/metrics.py measure --name guidance --directory "$RUNNER_TEMP/ci-metrics" -- python3 scripts/check-agent-guidance.py
      - name: Test development tooling
        run: python3 scripts/ci/metrics.py measure --name agent-tooling --directory "$RUNNER_TEMP/ci-metrics" -- python3 -m unittest discover -s scripts/agent_loop -t scripts -p 'test_*.py'
      - name: Test CI measurements
        run: python3 scripts/ci/metrics.py measure --name ci-tests --directory "$RUNNER_TEMP/ci-metrics" -- python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py'
      - name: Check CI collector syntax and help
        run: |
          python3 -m py_compile scripts/ci/metrics.py
          python3 scripts/ci/metrics.py --help
          python3 scripts/ci/metrics.py report --help
          python3 scripts/ci/metrics.py measure --help
          python3 scripts/ci/metrics.py summary --help
      - name: Validate Actions workflow with actionlint 1.7.12
        if: runner.os == 'Linux'
        run: |
          actionlint_dir="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir -p "$actionlint_dir"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$actionlint_dir/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" -version
          "$actionlint_dir/actionlint" -shellcheck='' -pyflakes='' .github/workflows/quality.yml
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
  rust:
    name: Rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GIT_CONFIG_NOSYSTEM: 1
    steps:
      - name: Isolate CI Git configuration
        run: printf 'GIT_CONFIG_GLOBAL=%s/gitturtle-ci-gitconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config git openssh-client ca-certificates \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan-dev \
            python3 python3-pil desktop-file-utils xdg-utils
          pkg-config --exists xkbcommon-x11 x11-xcb
      - name: Install pinned workspace Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Format
        run: python3 scripts/ci/metrics.py measure --name format --directory "$RUNNER_TEMP/ci-metrics" -- cargo fmt --all -- --check
      - name: Locked workspace tests
        run: python3 scripts/ci/metrics.py measure --name tests --directory "$RUNNER_TEMP/ci-metrics" -- cargo test --locked --workspace --timings
      - name: Locked Clippy
        run: python3 scripts/ci/metrics.py measure --name clippy --directory "$RUNNER_TEMP/ci-metrics" -- cargo clippy --locked --workspace --all-targets --timings -- -D warnings
      - name: Locked release compilation
        run: python3 scripts/ci/metrics.py measure --name release --directory "$RUNNER_TEMP/ci-metrics" -- cargo build --release --locked -p gitturtle --timings
      - name: Linux bundle and isolated user installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/ci/metrics.py measure --name linux-package --directory "$RUNNER_TEMP/ci-metrics" -- \
            bash --noprofile --norc -euo pipefail <<'PACKAGE'
          package_dir="$RUNNER_TEMP/gitturtle-linux-package"
          scripts/package-linux.sh --no-build --binary target/release/gitturtle "$package_dir"
          python3 scripts/test-install-linux.py --bundle "$package_dir"
          unpacked="$(mktemp -d "$RUNNER_TEMP/gitturtle-unpacked.XXXXXX")"
          tar -xzf "$package_dir.tar.gz" -C "$unpacked"
          install_home="$(mktemp -d "$RUNNER_TEMP/gitturtle-install.XXXXXX")"
          (
            cd "$unpacked"
            env -i HOME="$install_home" XDG_DATA_HOME="$install_home/.local/share" PATH=/usr/bin:/bin \
              python3 gitturtle-linux-package/install.py
          )
          test -x "$install_home/.local/bin/gitturtle"
          cmp target/release/gitturtle "$install_home/.local/bin/gitturtle"
          test -s "$install_home/.local/share/gitturtle/licenses/LICENSE"
          test -s "$install_home/.local/share/gitturtle/licenses/dependencies.json"
          desktop-file-validate "$install_home/.local/share/applications/com.gitturtle.desktop.desktop"
          ldd "$install_home/.local/bin/gitturtle" > "$RUNNER_TEMP/gitturtle-ldd.txt"
          cat "$RUNNER_TEMP/gitturtle-ldd.txt"
          if grep -F 'not found' "$RUNNER_TEMP/gitturtle-ldd.txt"; then
            exit 1
          fi
          launch_status=0
          env -i HOME="$install_home" PATH=/usr/bin:/bin "$install_home/.local/bin/gitturtle" \
            > "$RUNNER_TEMP/gitturtle-no-display.txt" 2>&1 || launch_status=$?
          cat "$RUNNER_TEMP/gitturtle-no-display.txt"
          test "$launch_status" -eq 1
          grep -F 'GitTurtle needs a Wayland or X11 desktop session' "$RUNNER_TEMP/gitturtle-no-display.txt"
          PACKAGE
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
