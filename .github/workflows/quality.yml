name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  changes:
    name: Changes and CI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.classify.outputs.product }}
      tooling: ${{ steps.classify.outputs.tooling }}
      website: ${{ steps.classify.outputs.website }}
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Local comparisons avoid the API/path-filter changed-file limits.
          fetch-depth: 0
      - name: Check development guidance
        run: python3 scripts/check-agent-guidance.py
      - name: Test CI helpers and required results
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_*.py'
      - name: Validate Actions workflow with actionlint 1.7.12
        run: |
          actionlint_dir="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir -p "$actionlint_dir"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$actionlint_dir/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" -version
          "$actionlint_dir/actionlint" -shellcheck='' -pyflakes=''
      - name: Classify changed inputs
        id: classify
        run: python3 scripts/ci/changes.py classify --output "$GITHUB_OUTPUT"
  agent-tooling:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    name: Development tooling · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Python runtime
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11 or newer is required"'
      - name: Validate development guidance
        run: python3 scripts/ci/metrics.py measure --name guidance --directory "$RUNNER_TEMP/ci-metrics" -- python3 scripts/check-agent-guidance.py
      - name: Test development tooling
        run: python3 scripts/ci/metrics.py measure --name agent-tooling --directory "$RUNNER_TEMP/ci-metrics" -- python3 -m unittest discover -s scripts/agent_loop -t scripts -p 'test_*.py'
      - name: Test native-QA tooling
        run: python3 scripts/ci/metrics.py measure --name native-qa-tooling --directory "$RUNNER_TEMP/ci-metrics" -- python3 -m unittest discover -s scripts/native_qa -t scripts -p 'test_*.py'
      - name: Test CI measurements
        run: python3 scripts/ci/metrics.py measure --name ci-tests --directory "$RUNNER_TEMP/ci-metrics" -- python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py'
      - name: Check CI collector syntax and help
        run: |
          python3 -m py_compile scripts/ci/metrics.py
          python3 scripts/ci/metrics.py --help
          python3 scripts/ci/metrics.py report --help
          python3 scripts/ci/metrics.py measure --help
          python3 scripts/ci/metrics.py summary --help
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
  rust-format:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: 1
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup uses rust-toolchain.toml; formatting needs no native libraries,
      # dependency restore or compilation, and never waits for a Rust build.
      - name: Format with the pinned workspace toolchain
        run: python3 scripts/ci/metrics.py measure --name format --directory "$RUNNER_TEMP/ci-metrics" -- cargo fmt --all -- --check
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

  rust-debug:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    name: Rust tests and Clippy · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15, ubuntu-24.04]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GIT_CONFIG_NOSYSTEM: 1
    steps:
      - name: Isolate CI Git configuration
        run: printf 'GIT_CONFIG_GLOBAL=%s/gitturtle-ci-gitconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # crates/app/build.rs watches .git/packed-refs, which a shallow checkout
      # lacks. Cargo reruns a build script whose watched file is missing, so
      # each later Cargo command would recompile the app. Packing the refs
      # while keeping the loose ones changes no ref and no ref file it watches.
      - name: Give the checkout the Git files the app build watches
        run: git pack-refs --all --no-prune
      - name: Prepare Rust and restore bounded dependencies
        uses: ./.github/actions/setup-rust
        with:
          profile: debug
          vendor-reuse: true
      # Outside setup-rust, so the pin does not change the Rust cache key.
      - name: Install pinned, checksum-verified cargo-nextest
        run: python3 scripts/ci/metrics.py measure --name nextest-install --directory "$RUNNER_TEMP/ci-metrics" -- python3 scripts/ci/tools.py install-nextest --directory "$RUNNER_TEMP/cargo-nextest" --path-file "$GITHUB_PATH"
      # These phases share one cold debug build. nextest builds and runs the
      # same unit and integration tests as `cargo test` with the ci profile in
      # .config/nextest.toml; it cannot run doctests, so Cargo runs them next.
      # The doctest step keeps Cargo's default selection so it reuses that
      # build: `--doc` alone drops the bin-only dependencies and rebuilds every
      # shared proc-macro dependency. Only doctest names contain "(line ".
      - name: Locked workspace tests with nextest
        run: python3 scripts/ci/metrics.py measure --name tests --directory "$RUNNER_TEMP/ci-metrics" -- cargo nextest run --locked --workspace -P ci --no-fail-fast --timings
      - name: Locked workspace doctests
        run: python3 scripts/ci/metrics.py measure --name doctests --directory "$RUNNER_TEMP/ci-metrics" -- cargo test --locked --workspace --timings -- "(line "
      - name: Locked all-target Clippy
        run: python3 scripts/ci/metrics.py measure --name clippy --directory "$RUNNER_TEMP/ci-metrics" -- cargo clippy --locked --workspace --all-targets --timings -- -D warnings
      - name: Prepare bounded successful-main debug cache save
        uses: ./.github/actions/setup-rust
        with:
          phase: finish
          profile: debug
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

  rust-release:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    name: Rust release · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GIT_CONFIG_NOSYSTEM: 1
    steps:
      - name: Isolate CI Git configuration
        run: printf 'GIT_CONFIG_GLOBAL=%s/gitturtle-ci-gitconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select verified Xcode 26.3 before cache identity
        if: runner.os == 'macOS'
        run: python3 scripts/release/workflow.py select-xcode
      - name: Prepare Rust and restore bounded dependencies
        uses: ./.github/actions/setup-rust
        with:
          profile: release
          vendor-reuse: true
      - name: Install declared package target
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: rustup target add "$PACKAGE_TARGET"
      - name: Locked release compilation
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/ci/metrics.py measure --name release --directory "$RUNNER_TEMP/ci-metrics" -- cargo build --release --locked -p gitturtle --target "$PACKAGE_TARGET" --timings
      - name: Package the exact optimized executable and enforce complete notices
        id: package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_REVISION: ${{ github.sha }}
          PACKAGE_EVENT: ${{ github.event_name }}
          PACKAGE_RUN_ID: ${{ github.run_id }}
          PACKAGE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # The summary reads root JSON files as command measurements. Keep
          # package reports nested; the diagnostics upload retains both kinds.
          mkdir -p "$RUNNER_TEMP/ci-metrics/reports"
          python3 scripts/ci/metrics.py measure --name package --directory "$RUNNER_TEMP/ci-metrics" -- \
            python3 scripts/ci/packages.py prepare --target "$PACKAGE_TARGET" --revision "$PACKAGE_REVISION" \
              --event "$PACKAGE_EVENT" --run-id "$PACKAGE_RUN_ID" --attempt "$PACKAGE_ATTEMPT" \
              --directory "$RUNNER_TEMP/ci-package" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" \
              --report "$RUNNER_TEMP/ci-metrics/reports/package-prepared.json"
      # Only the complete-notice publish directory is eligible. Development
      # archives and logs are never swept into the public binary artifact.
      - name: Upload verified early-development CI package
        id: uploaded
        if: steps.package.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: ${{ runner.temp }}/ci-package/publish/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
      - name: Download this exact uploaded artifact from Actions
        if: steps.package.outputs.eligible == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.uploaded.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-package-download
          merge-multiple: true
          digest-mismatch: error
      - name: Verify downloaded bytes and installation
        if: steps.package.outputs.eligible == 'true'
        env:
          PACKAGE_ARTIFACT_ID: ${{ steps.uploaded.outputs.artifact-id }}
        run: |
          python3 scripts/ci/metrics.py measure --name artifact-download-checks --directory "$RUNNER_TEMP/ci-metrics" -- \
            python3 scripts/ci/packages.py verify --expected "$RUNNER_TEMP/ci-package/prepared.json" \
              --directory "$RUNNER_TEMP/ci-package-download" --artifact-id "$PACKAGE_ARTIFACT_ID" \
              --report "$RUNNER_TEMP/ci-metrics/reports/package-transfer.json" --summary "$GITHUB_STEP_SUMMARY"
      # All target/TRIPLE/release consumers must precede cache finish:
      # successful main jobs may clean outputs to keep the retained cache bounded.
      - name: Prepare bounded successful-main cache save
        uses: ./.github/actions/setup-rust
        with:
          phase: finish
          profile: release
          target: ${{ matrix.target }}
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

  # Builds and tests the workspace against current Arch Linux packages. The
  # official image is pinned by digest: tag base-devel, pushed 2026-09-21 and
  # read from the Docker Hub registry on 2026-09-28. Arch is a rolling release,
  # so `pacman -Syu` still installs that day's packages; docs/ci.md explains how
  # to refresh the pin. Its Rust cache is keyed on the pacman versions of the
  # packages that reach compiled output, and only main saves it (docs/ci.md).
  rust-arch:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    name: Rust tests · archlinux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux:base-devel@sha256:8745817f349ed24373341ddb92776209eeec3f0364ea48f7f645ac5800d30a50
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GIT_CONFIG_NOSYSTEM: 1
      # rust-cache also exports this after its restore; set here, it holds for
      # the toolchain step and when that restore step fails.
      CARGO_INCREMENTAL: 0
      LANG: C.UTF-8
    # The container starts as root, which ignores file permissions: the tests
    # that expect a refused write would fail and others skip themselves. Every
    # run step therefore executes as an unprivileged user that owns the
    # checkout. Only the three setup steps that name their shell run as root;
    # the setup action runs its helper and Cargo as the same account.
    defaults:
      run:
        shell: setpriv --reuid=builder --regid=builder --init-groups -- bash --noprofile --norc -euo pipefail {0}
    steps:
      # Before checkout: without Git in the image, checkout downloads a tarball
      # with no .git, which the app build script and pack-refs need. Arch does
      # not support partial upgrades, so the install is a full system upgrade.
      - name: Upgrade Arch and install build and test packages
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          # Package install scripts run as root here: refuse an image whose
          # pacman would accept an unsigned or untrusted package, globally or
          # in a repository that overrides the level (an empty override inherits).
          check_siglevel() {
            if [ -n "$2" ] && { ! grep -qx PackageRequired <<<"$2" || grep -qxE 'PackageNever|PackageOptional|PackageTrustAll' <<<"$2"; }; then
              echo "::error::pacman does not require trusted package signatures ($1: $(tr '\n' ' ' <<<"$2"))"
              exit 1
            fi
          }
          global=$(pacman-conf SigLevel)
          [ -n "$global" ] || { echo "::error::pacman-conf reported no SigLevel"; exit 1; }
          check_siglevel global "$global"
          for repo in $(pacman-conf --repo-list); do
            check_siglevel "$repo" "$(pacman-conf --repo="$repo" SigLevel)"
          done
          echo "pacman SigLevel: $(tr '\n' ' ' <<<"$global")"
          pacman -Sy --noconfirm --noprogressbar --needed archlinux-keyring
          pacman -Su --noconfirm --noprogressbar --needed \
            base-devel clang cmake git openssh python rustup ca-certificates \
            fontconfig freetype2 wayland libxkbcommon libxkbcommon-x11 libx11 libxcb \
            vulkan-icd-loader vulkan-headers openssl zstd
          pkg-config --exists fontconfig freetype2 wayland-client xkbcommon xkbcommon-x11 x11-xcb vulkan
          # The rolling versions this run built against, for comparing runs.
          pacman -Q glibc gcc clang cmake git python rustup fontconfig freetype2 wayland libxkbcommon libx11
      # The runner's account owns RUNNER_TEMP, HOME and the file-command files;
      # the build user takes its UID so later steps can write them.
      - name: Create the unprivileged build user
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          uid=$(stat -c %u "$RUNNER_TEMP")
          if [ "$uid" -eq 0 ]; then
            echo "::error::RUNNER_TEMP is owned by root; there is no unprivileged runner UID to adopt"
            exit 1
          fi
          useradd --uid "$uid" --user-group --no-create-home --home-dir "$HOME" --shell /usr/bin/bash builder
          setpriv --reuid=builder --regid=builder --init-groups -- id
          # setpriv also sets the saved UID, so the kernel drops every capability.
          setpriv --reuid=builder --regid=builder --init-groups -- grep -qE '^CapEff:[[:space:]]+0+$' /proc/self/status
      # The setup action sets CARGO_HOME to its own isolated cache root.
      - name: Isolate CI Git configuration and Rust storage
        run: |
          printf 'GIT_CONFIG_GLOBAL=%s/gitturtle-ci-gitconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUSTUP_HOME=%s/rustup\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Checkout runs as root and records only this workspace as safe.directory
      # in the isolated file above. After the chown the build user owns the
      # repository, so its Git commands pass the ownership check on their own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Give the build user the checkout
        shell: bash --noprofile --norc -euo pipefail {0}
        run: chown -R builder:builder "$GITHUB_WORKSPACE"
      # As in rust-debug: crates/app/build.rs watches .git/packed-refs, which a
      # shallow checkout lacks, so every later Cargo command would recompile the
      # app. Packing the refs while keeping the loose ones changes no ref.
      - name: Give the checkout the Git files the app build watches
        run: git pack-refs --all --no-prune
      # rustup reads rust-toolchain.toml, as on the other runners.
      - name: Install pinned workspace Rust toolchain
        run: |
          python3 scripts/ci/metrics.py measure --name rust-toolchain --directory "$RUNNER_TEMP/ci-metrics" -- rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version
      # After the toolchain, whose `rustc -vV` is part of the key.
      - name: Prepare Rust and restore bounded dependencies
        uses: ./.github/actions/setup-rust
        with:
          profile: debug
          vendor-reuse: true
          container: archlinux
          run-as: builder
      - name: Install pinned, checksum-verified cargo-nextest
        run: python3 scripts/ci/metrics.py measure --name nextest-install --directory "$RUNNER_TEMP/ci-metrics" -- python3 scripts/ci/tools.py install-nextest --directory "$RUNNER_TEMP/cargo-nextest" --path-file "$GITHUB_PATH"
      # The same two phases as rust-debug, which explains the doctest filter.
      - name: Locked workspace tests with nextest
        run: python3 scripts/ci/metrics.py measure --name tests --directory "$RUNNER_TEMP/ci-metrics" -- cargo nextest run --locked --workspace -P ci --no-fail-fast --timings
      - name: Locked workspace doctests
        run: python3 scripts/ci/metrics.py measure --name doctests --directory "$RUNNER_TEMP/ci-metrics" -- cargo test --locked --workspace --timings -- "(line "
      - name: Prepare bounded successful-main debug cache save
        uses: ./.github/actions/setup-rust
        with:
          phase: finish
          profile: debug
          container: archlinux
          run-as: builder
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

  # Template-scans added or changed images against private-string templates
  # that exist only in the optional NATIVE_QA_PRIVACY_TEMPLATES secret. GitHub
  # withholds secrets from fork pull requests; those runs, and a repository
  # without the secret, record "unavailable" with a notice instead of a pass.
  image-privacy:
    name: Image privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      status: ${{ steps.scan.outputs.status || steps.plan.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: List added or changed images
        id: plan
        env:
          TEMPLATES_CONFIGURED: ${{ secrets.NATIVE_QA_PRIVACY_TEMPLATES != '' }}
        run: python3 scripts/ci/image_privacy.py plan --list "$RUNNER_TEMP/image-privacy/images" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      # The Ubuntu archive's signed package; the scan's C engine uses the runner's compiler.
      - name: Install Pillow from the Ubuntu archive
        if: steps.plan.outputs.status == 'scan'
        run: |
          if ! /usr/bin/python3 -c 'import PIL' 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends python3-pil
          fi
          /usr/bin/python3 -c 'import PIL; print("Pillow", PIL.__version__)'
      - name: Template-scan added or changed images
        id: scan
        if: steps.plan.outputs.status == 'scan'
        env:
          NATIVE_QA_PRIVACY_TEMPLATES: ${{ secrets.NATIVE_QA_PRIVACY_TEMPLATES }}
        run: /usr/bin/python3 scripts/ci/image_privacy.py scan --list "$RUNNER_TEMP/image-privacy/images" --directory "$RUNNER_TEMP/image-privacy" --jobs "$(nproc)" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/website.yml

  quality:
    name: Quality gate
    if: always()
    needs: [changes, agent-tooling, rust-format, rust-debug, rust-release, rust-arch, image-privacy, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every classified check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/changes.py gate
