name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly cache-seed run so main caches stay warm even across doc-only weeks.
    - cron: '17 4 * * 0'

permissions:
  contents: read

concurrency:
  group: >-
    quality-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && format('dispatch-{0}', github.ref)) ||
      format('{0}-{1}', github.event_name, github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  changes:
    name: Changes and CI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.classify.outputs.product }}
      tooling: ${{ steps.classify.outputs.tooling }}
      website: ${{ steps.classify.outputs.website }}
      has-images: ${{ steps.classify.outputs.has-images }}
      seed-only: ${{ steps.classify.outputs.seed-only }}
      debug-matrix: ${{ steps.classify.outputs.debug-matrix }}
      arch-matrix: ${{ steps.classify.outputs.arch-matrix }}
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Local comparisons avoid the API/path-filter changed-file limits;
          # blobless clone fetches commits and trees without 200+ MiB of blobs.
          fetch-depth: 0
          filter: blob:none
      - name: Check development guidance
        run: python3 scripts/check-agent-guidance.py
      - name: Check documentation sync
        run: python3 scripts/check-docs-sync.py
      - name: Check architectural invariants
        run: python3 -B scripts/dev/check_invariants.py
      - name: Test routing and gate policy
        run: python3 -B -m unittest scripts/ci/tests/test_changes.py
      - name: Validate Actions workflow with actionlint 1.7.12
        run: |
          actionlint_dir="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir -p "$actionlint_dir"
          # One anonymous attempt over HTTPS only, on the first request and on every redirect; nothing
          # is retried. A failure ends the step with a line that names the host it happened on and the
          # status or curl's reason. The line takes the host alone: the release redirects to a URL
          # with a signed query, and neither the request's URL nor its query is printed.
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 60 \
            --write-out '%{onerror}%{stderr}::error::actionlint download failed at %{urle.host}: %{errormsg} (curl exit %{exitcode})\n' \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_dir/actionlint.tar.gz"
          # --status keeps the runner's path out of the log, so a wrong digest gets a line of its own:
          # a fixed one, without the fetched file's digest. Nothing is unpacked or run after it.
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$actionlint_dir/actionlint.tar.gz" | sha256sum --check --status || {
            echo "::error::actionlint archive's SHA-256 is not the pinned one"
            exit 1
          }
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" -version
          "$actionlint_dir/actionlint" -shellcheck='' -pyflakes=''
      - name: Audit Actions workflows with zizmor 1.32.0
        run: |
          zizmor_dir="$RUNNER_TEMP/zizmor-1.32.0"
          mkdir -p "$zizmor_dir"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 60 \
            --write-out '%{onerror}%{stderr}::error::zizmor download failed at %{urle.host}: %{errormsg} (curl exit %{exitcode})\n' \
            https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output "$zizmor_dir/zizmor.tar.gz"
          printf '%s  %s\n' 'bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b' \
            "$zizmor_dir/zizmor.tar.gz" | sha256sum --check --status || {
            echo "::error::zizmor archive's SHA-256 is not the pinned one"
            exit 1
          }
          tar -xzf "$zizmor_dir/zizmor.tar.gz" -C "$zizmor_dir" zizmor
          "$zizmor_dir/zizmor" --version
          "$zizmor_dir/zizmor" --offline --min-severity medium .github/workflows .github/actions
      - name: Classify changed inputs
        id: classify
        run: python3 scripts/ci/changes.py classify --output "$GITHUB_OUTPUT"
  ci-tests:
    needs: changes
    name: CI unit tests · ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test CI helpers and required results
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_*.py'
  agent-tooling:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    name: Development tooling · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Python runtime
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11 or newer is required"'
      - name: Validate development guidance
        run: python3 scripts/ci/metrics.py measure --name guidance --directory "$RUNNER_TEMP/ci-metrics" -- python3 scripts/check-agent-guidance.py
      - name: Validate documentation sync
        run: python3 scripts/ci/metrics.py measure --name docs-sync --directory "$RUNNER_TEMP/ci-metrics" -- python3 scripts/check-docs-sync.py
      - name: Test development, gate, native-QA and CI tooling side by side
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            python3 scripts/ci/tooling_suites.py run --skip-ci-tests --directory "$RUNNER_TEMP/ci-metrics"
          else
            python3 scripts/ci/tooling_suites.py run --directory "$RUNNER_TEMP/ci-metrics"
          fi
      - name: Check CI collector syntax and help
        run: |
          python3 -m py_compile scripts/ci/metrics.py
          python3 scripts/ci/metrics.py --help
          python3 scripts/ci/metrics.py report --help
          python3 scripts/ci/metrics.py measure --help
          python3 scripts/ci/metrics.py summary --help
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
  rust-format:
    needs: changes
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.seed-only != 'true'
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: 1
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup uses rust-toolchain.toml; formatting needs no native libraries,
      # dependency restore or compilation, and never waits for a Rust build.
      - name: Format with the pinned workspace toolchain
        run: python3 scripts/ci/metrics.py measure --name format --directory "$RUNNER_TEMP/ci-metrics" -- cargo fmt --all -- --check
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

  rust-debug:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    name: Rust tests · ${{ matrix.os }} · ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ${{ matrix.os }}
    # The limit only backs up a hung step: nextest's ci profile terminates any
    # test after 120 s (terminate-after in .config/nextest.toml). Unsharded,
    # the test jobs took about 25 to 31 minutes on a normal runner and runners
    # have been seen 1.8 times slower, which 60 minutes holds and 45 did not
    # (quality run 41757534359; docs/ci.md#test-execution-with-nextest). A
    # shard builds everything and runs half the tests under the same limit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Every leg at once: 3 macOS shards + 2 Ubuntu shards (or 2 shard-1 cache
      # seed legs on weekly schedule, using 1 macOS slot instead of 3).
      max-parallel: 5
      matrix: ${{ fromJSON(needs.changes.outputs.debug-matrix) }}
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GIT_CONFIG_NOSYSTEM: 1
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Isolate CI Git configuration
        run: printf 'GIT_CONFIG_GLOBAL=%s/gitturtle-ci-gitconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # crates/app/build.rs watches .git/packed-refs, which a shallow checkout
      # lacks. Cargo reruns a build script whose watched file is missing, so
      # each later Cargo command would recompile the app. Packing the refs
      # while keeping the loose ones changes no ref and no ref file it watches.
      - name: Give the checkout the Git files the app build watches
        run: git pack-refs --all --no-prune
      - name: Prepare Rust and restore bounded dependencies
        uses: ./.github/actions/setup-rust
        with:
          profile: debug
          vendor-reuse: true
      # The pin is part of the debug cache key, and its release archive rides
      # in that entry: a restored job verifies it and makes no request
      # (docs/ci.md#the-nextest-archive-in-the-debug-entry).
      - name: Install pinned, checksum-verified cargo-nextest
        run: python3 scripts/ci/metrics.py measure --name nextest-install --directory "$RUNNER_TEMP/ci-metrics" -- python3 scripts/ci/tools.py install-nextest --directory "$RUNNER_TEMP/cargo-nextest" --path-file "$GITHUB_PATH" --archive-cache "$CI_RUST_CACHE_TOOL_ARCHIVES"
      # These phases share one cold debug build. nextest builds and runs the
      # same unit and integration tests as `cargo test` with the ci profile in
      # .config/nextest.toml; it cannot run doctests, so Cargo runs them next.
      # The doctest step keeps Cargo's default selection so it reuses that
      # build: `--doc` alone drops the bin-only dependencies and rebuilds every
      # shared proc-macro dependency. Only doctest names contain "(line ".
      # The partition chooses among the built tests at run time, so every shard
      # builds the same targets. What must happen once per platform happens in
      # shard 1 alone: the doctests and the finish phase, which leaves each
      # platform's debug cache entry its single writer.
      - name: Locked workspace tests with nextest
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: python3 scripts/ci/metrics.py measure --name tests --directory "$RUNNER_TEMP/ci-metrics" -- cargo nextest run --locked --workspace -P ci --no-fail-fast --timings --partition "slice:$SHARD/$SHARDS"
      - name: Print the libdav1d link and initializers
        # Requirement 15 of the AVIF and JPEG 2000 security review on Linux
        # shards: reads ELF dynamic tags, dav1d_* dynsym entries, and
        # libdav1d's DT_INIT / .init_array initializers.
        if: runner.os == 'Linux'
        run: python3 scripts/ci/libdav1d_elf.py
      - name: Locked workspace doctests
        if: matrix.shard == 1
        run: python3 scripts/ci/metrics.py measure --name doctests --directory "$RUNNER_TEMP/ci-metrics" -- cargo test --locked --workspace --timings -- "(line "
      - name: Prepare bounded successful-main debug cache save
        if: matrix.shard == 1
        uses: ./.github/actions/setup-rust
        with:
          phase: finish
          profile: debug
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The shards of a platform share the job id, the OS and the architecture.
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

  # Clippy runs beside the tests instead of after them, so the test job is the
  # build and the tests only, and a failing test no longer hides Clippy's
  # result. It restores the debug cache that the same platform's test job
  # saves (same profile, runner and key) and never saves one: a save here would
  # race that job's for the same key, and an entry holding only Clippy's checked
  # dependencies would leave the test job a cache without its build.
  rust-clippy:
    needs: changes
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.seed-only != 'true'
    name: Rust Clippy · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Clippy already ran inside 45 minutes as the last step of the combined
    # test job; alone, without the test build and the tests, it stays well
    # inside them on a slow runner. Nothing else stops a hung Cargo step here:
    # nextest's terminator bounds only tests.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15, ubuntu-24.04]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GIT_CONFIG_NOSYSTEM: 1
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Isolate CI Git configuration
        run: printf 'GIT_CONFIG_GLOBAL=%s/gitturtle-ci-gitconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One Cargo command, as in rust-release, so the app's build script runs
      # once and the refs it watches need no packing.
      - name: Prepare Rust and restore bounded dependencies
        uses: ./.github/actions/setup-rust
        with:
          profile: debug
          vendor-reuse: true
          install-tool-packages: false
      - name: Locked all-target Clippy
        run: python3 scripts/ci/metrics.py measure --name clippy --directory "$RUNNER_TEMP/ci-metrics" -- cargo clippy --locked --workspace --all-targets --timings -- -D warnings
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

  rust-release:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    name: Rust release · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Every leg at once, as in the other matrices: the legs share no runner,
      # cache entry or artifact name.
      max-parallel: 3
      matrix:
        # Each leg compiles for its own runner, so `target` is that runner's
        # host triple: the Linux packager packages only its machine's own.
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    # What the package-transfer job reads of each Linux package: the leg's
    # answer, the SHA-256 of the provenance file it uploaded and the uploaded
    # artifact's ID. packages.py writes each under its target's own label, so a
    # leg sets its own three and leaves the other label's empty, and an empty
    # value sets nothing: the other leg's values stand (docs/ci.md).
    outputs:
      linux-x86_64-eligible: ${{ steps.package.outputs.linux-x86_64-eligible }}
      linux-x86_64-provenance-sha256: ${{ steps.package.outputs.linux-x86_64-provenance-sha256 }}
      linux-x86_64-artifact-id: ${{ steps.handoff.outputs.linux-x86_64-artifact-id }}
      linux-aarch64-eligible: ${{ steps.package.outputs.linux-aarch64-eligible }}
      linux-aarch64-provenance-sha256: ${{ steps.package.outputs.linux-aarch64-provenance-sha256 }}
      linux-aarch64-artifact-id: ${{ steps.handoff.outputs.linux-aarch64-artifact-id }}
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GIT_CONFIG_NOSYSTEM: 1
    steps:
      - name: Isolate CI Git configuration
        run: printf 'GIT_CONFIG_GLOBAL=%s/gitturtle-ci-gitconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select installed Xcode 26 or later before cache identity
        if: runner.os == 'macOS'
        run: python3 scripts/release/workflow.py select-xcode
      - name: Prepare Rust and restore bounded dependencies
        uses: ./.github/actions/setup-rust
        with:
          profile: release
          vendor-reuse: true
      - name: Install declared package target
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: rustup target add "$PACKAGE_TARGET"
      - name: Locked release compilation
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/ci/metrics.py measure --name release --directory "$RUNNER_TEMP/ci-metrics" -- cargo build --release --locked -p gitturtle --target "$PACKAGE_TARGET" --timings
      - name: Package the exact optimized executable and enforce complete notices
        id: package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_REVISION: ${{ github.sha }}
          PACKAGE_EVENT: ${{ github.event_name }}
          PACKAGE_RUN_ID: ${{ github.run_id }}
          PACKAGE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # The summary reads root JSON files as command measurements. Keep
          # package reports nested; the diagnostics upload retains both kinds.
          mkdir -p "$RUNNER_TEMP/ci-metrics/reports"
          python3 scripts/ci/metrics.py measure --name package --directory "$RUNNER_TEMP/ci-metrics" -- \
            python3 scripts/ci/packages.py prepare --target "$PACKAGE_TARGET" --revision "$PACKAGE_REVISION" \
              --event "$PACKAGE_EVENT" --run-id "$PACKAGE_RUN_ID" --attempt "$PACKAGE_ATTEMPT" \
              --directory "$RUNNER_TEMP/ci-package" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" \
              --report "$RUNNER_TEMP/ci-metrics/reports/package-prepared.json"
      # Only the complete-notice publish directory is eligible. Development
      # archives and logs are never swept into the public binary artifact.
      - name: Upload verified early-development CI package
        id: uploaded
        if: steps.package.outputs.eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: ${{ runner.temp }}/ci-package/publish/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
      # This job does not read its upload back: the run's artifact listing can
      # lack a new ID for a moment after the upload. The package-transfer job,
      # which needs this one, downloads the artifact by this exact ID and
      # verifies it. packages.py checks the ID's form and writes it under this
      # leg's own label.
      - name: Hand the uploaded artifact's ID to the later job
        id: handoff
        if: steps.package.outputs.eligible == 'true'
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_ARTIFACT_ID: ${{ steps.uploaded.outputs.artifact-id }}
        run: python3 scripts/ci/packages.py hand-off --target "$PACKAGE_TARGET" --artifact-id "$PACKAGE_ARTIFACT_ID" --output "$GITHUB_OUTPUT"
      # All target/TRIPLE/release consumers must precede cache finish:
      # successful main jobs may clean outputs to keep the retained cache bounded.
      - name: Prepare bounded successful-main cache save
        uses: ./.github/actions/setup-rust
        with:
          phase: finish
          profile: release
          target: ${{ matrix.target }}
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

  # Builds and tests the workspace against current Arch Linux packages. The
  # official image is pinned by digest: tag base-devel, pushed 2026-09-21 and
  # read from the Docker Hub registry on 2026-09-28. Arch is a rolling release,
  # so `pacman -Syu` still installs that day's packages; docs/ci.md explains how
  # to refresh the pin. Its Rust cache is keyed on the pacman versions of the
  # packages that reach compiled output, and only main saves it (docs/ci.md).
  rust-arch:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    name: Rust tests · archlinux · ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-24.04
    # As in rust-debug, the limit only backs up a hung step: nextest's ci
    # profile terminates any test after 120 s (terminate-after in
    # .config/nextest.toml). Unsharded, this job took about 28 minutes on a
    # normal runner; 1.8 times slower is 50, inside 60 and past 45. A shard
    # builds everything and runs half the tests under the same limit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.changes.outputs.arch-matrix) }}
    container:
      image: archlinux:base-devel@sha256:8745817f349ed24373341ddb92776209eeec3f0364ea48f7f645ac5800d30a50
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GIT_CONFIG_NOSYSTEM: 1
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # rust-cache also exports this after its restore; set here, it holds for
      # the toolchain step and when that restore step fails.
      CARGO_INCREMENTAL: 0
      LANG: C.UTF-8
    # The container starts as root, which ignores file permissions: the tests
    # that expect a refused write would fail and others skip themselves. Every
    # run step therefore executes as an unprivileged user that owns the
    # checkout. Only the three setup steps that name their shell run as root;
    # the setup action runs its helper and Cargo as the same account.
    defaults:
      run:
        shell: setpriv --reuid=builder --regid=builder --init-groups -- bash --noprofile --norc -euo pipefail {0}
    steps:
      # Before checkout: without Git in the image, checkout downloads a tarball
      # with no .git, which the app build script and pack-refs need. Arch does
      # not support partial upgrades, so the install is a full system upgrade.
      - name: Upgrade Arch and install build and test packages
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          # Package install scripts run as root here: refuse an image whose
          # pacman would accept an unsigned or untrusted package, globally or
          # in a repository that overrides the level (an empty override inherits).
          check_siglevel() {
            if [ -n "$2" ] && { ! grep -qx PackageRequired <<<"$2" || grep -qxE 'PackageNever|PackageOptional|PackageTrustAll' <<<"$2"; }; then
              echo "::error::pacman does not require trusted package signatures ($1: $(tr '\n' ' ' <<<"$2"))"
              exit 1
            fi
          }
          global=$(pacman-conf SigLevel)
          [ -n "$global" ] || { echo "::error::pacman-conf reported no SigLevel"; exit 1; }
          check_siglevel global "$global"
          for repo in $(pacman-conf --repo-list); do
            check_siglevel "$repo" "$(pacman-conf --repo="$repo" SigLevel)"
          done
          echo "pacman SigLevel: $(tr '\n' ' ' <<<"$global")"
          # A SYSTEM_DEPS_ variable can make dav1d-sys git-clone dav1d and link
          # that copy statically; the build links only the signed system package.
          if names=$(compgen -e | grep '^SYSTEM_DEPS_'); then
            echo "::error::SYSTEM_DEPS_ variables must not reach the build: $(tr '\n' ' ' <<<"$names")"
            exit 1
          fi
          pacman -Sy --noconfirm --noprogressbar --needed archlinux-keyring
          pacman -Su --noconfirm --noprogressbar --needed \
            base-devel clang cmake git openssh python rustup ca-certificates \
            fontconfig freetype2 wayland libxkbcommon libxkbcommon-x11 libx11 libxcb dav1d \
            vulkan-icd-loader vulkan-headers openssl zstd shared-mime-info
          pkg-config --exists fontconfig freetype2 wayland-client xkbcommon xkbcommon-x11 x11-xcb vulkan dav1d
          echo "libdav1d $(pkg-config --modversion dav1d) in $(pkg-config --variable=libdir dav1d)"
          # The rolling versions this run built against, for comparing runs.
          pacman -Q glibc gcc clang cmake git python rustup fontconfig freetype2 wayland libxkbcommon libx11 dav1d shared-mime-info
      # The runner's account owns RUNNER_TEMP, HOME and the file-command files;
      # the build user takes its UID so later steps can write them.
      - name: Create the unprivileged build user
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          uid=$(stat -c %u "$RUNNER_TEMP")
          if [ "$uid" -eq 0 ]; then
            echo "::error::RUNNER_TEMP is owned by root; there is no unprivileged runner UID to adopt"
            exit 1
          fi
          useradd --uid "$uid" --user-group --no-create-home --home-dir "$HOME" --shell /usr/bin/bash builder
          setpriv --reuid=builder --regid=builder --init-groups -- id
          # setpriv also sets the saved UID, so the kernel drops every capability.
          setpriv --reuid=builder --regid=builder --init-groups -- grep -qE '^CapEff:[[:space:]]+0+$' /proc/self/status
      # The setup action sets CARGO_HOME to its own isolated cache root.
      - name: Isolate CI Git configuration and Rust storage
        run: |
          printf 'GIT_CONFIG_GLOBAL=%s/gitturtle-ci-gitconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUSTUP_HOME=%s/rustup\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Checkout runs as root and records only this workspace as safe.directory
      # in the isolated file above. After the chown the build user owns the
      # repository, so its Git commands pass the ownership check on their own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Give the build user the checkout
        shell: bash --noprofile --norc -euo pipefail {0}
        run: chown -R builder:builder "$GITHUB_WORKSPACE"
      # As in rust-debug: crates/app/build.rs watches .git/packed-refs, which a
      # shallow checkout lacks, so every later Cargo command would recompile the
      # app. Packing the refs while keeping the loose ones changes no ref.
      - name: Give the checkout the Git files the app build watches
        run: git pack-refs --all --no-prune
      # rustup reads rust-toolchain.toml, as on the other runners.
      - name: Install pinned workspace Rust toolchain
        run: |
          python3 scripts/ci/metrics.py measure --name rust-toolchain --directory "$RUNNER_TEMP/ci-metrics" -- rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version
      # After the toolchain, whose `rustc -vV` is part of the key.
      - name: Prepare Rust and restore bounded dependencies
        uses: ./.github/actions/setup-rust
        with:
          profile: debug
          vendor-reuse: true
          container: archlinux
          run-as: builder
      - name: Install pinned, checksum-verified cargo-nextest
        run: python3 scripts/ci/metrics.py measure --name nextest-install --directory "$RUNNER_TEMP/ci-metrics" -- python3 scripts/ci/tools.py install-nextest --directory "$RUNNER_TEMP/cargo-nextest" --path-file "$GITHUB_PATH" --archive-cache "$CI_RUST_CACHE_TOOL_ARCHIVES"
      # The same two phases as rust-debug, which explains the doctest filter,
      # the partition and what shard 1 alone runs.
      - name: Locked workspace tests with nextest
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: python3 scripts/ci/metrics.py measure --name tests --directory "$RUNNER_TEMP/ci-metrics" -- cargo nextest run --locked --workspace -P ci --no-fail-fast --timings --partition "slice:$SHARD/$SHARDS"
      - name: Print the libdav1d link and initializers
        # The same records as in rust-debug, for Arch's libdav1d, in every
        # shard: the two containers upgrade separately, so each prints the
        # library its own tests met.
        run: python3 scripts/ci/libdav1d_elf.py
      - name: Locked workspace doctests
        if: matrix.shard == 1
        run: python3 scripts/ci/metrics.py measure --name doctests --directory "$RUNNER_TEMP/ci-metrics" -- cargo test --locked --workspace --timings -- "(line "
      - name: Prepare bounded successful-main debug cache save
        if: matrix.shard == 1
        uses: ./.github/actions/setup-rust
        with:
          phase: finish
          profile: debug
          container: archlinux
          run-as: builder
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The shards of a platform share the job id, the OS and the architecture.
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

  # Template-scans added or changed images against private-string templates
  # that exist only in the optional NATIVE_QA_PRIVACY_TEMPLATES secret. GitHub
  # withholds secrets from fork pull requests; those runs, and a repository
  # without the secret, record "unavailable" with a notice instead of a pass.
  # The matching is brute force (image pixels times template pixels), so eight
  # shards each make the same plan and scan every eighth image of its list;
  # image_privacy.py's `slice` refuses any other shard number or job count. A
  # matrix job's output is the last shard's to set it, so every shard reports a
  # status that is true of the whole list once all eight succeed, and Quality
  # gate needs this job's result to be success: a failed, cancelled or timed
  # out shard fails the gate (docs/ci.md#image-privacy-scan).
  image-privacy:
    needs: changes
    if: needs.changes.outputs.has-images == 'true'
    name: Image privacy · ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    # One 45-minute job was cancelled before it finished 735 images (quality
    # run 43781503794); eight shards of 90 minutes give a list sixteen times
    # that runner time. The templates' size, and so the real cost, is not
    # known outside the secret.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    outputs:
      status: ${{ steps.scan.outputs.status || steps.slice.outputs.status || steps.plan.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: List added or changed images
        id: plan
        env:
          TEMPLATES_CONFIGURED: ${{ secrets.NATIVE_QA_PRIVACY_TEMPLATES != '' }}
        run: python3 scripts/ci/image_privacy.py plan --list "$RUNNER_TEMP/image-privacy/images" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      # strategy.job-total is the matrix's real job count, so a matrix edited to
      # fewer jobs than the script's eight slices is refused instead of leaving
      # slices unscanned. An empty slice records "scanned" here, without the secret.
      - name: Take this shard's slice of the list
        id: slice
        if: steps.plan.outputs.status == 'scan'
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: python3 scripts/ci/image_privacy.py slice --list "$RUNNER_TEMP/image-privacy/images" --slice "$RUNNER_TEMP/image-privacy/slice" --shard "$SHARD" --shards "$SHARDS" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      # The Ubuntu archive's signed package; the scan's C engine uses the runner's compiler.
      # The helper reads the image's own Ubuntu source file alone, as the setup
      # action's install step does, and runs each apt command once under its deadline.
      - name: Install Pillow from the Ubuntu archive
        if: steps.slice.outputs.slice == 'scan'
        run: |
          if ! /usr/bin/python3 -c 'import PIL' 2>/dev/null; then
            python3 scripts/ci/apt_install.py \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -- \
              python3-pil
          fi
          /usr/bin/python3 -c 'import PIL; print("Pillow", PIL.__version__)'
      - name: Template-scan this shard's added or changed images
        id: scan
        if: steps.slice.outputs.slice == 'scan'
        env:
          NATIVE_QA_PRIVACY_TEMPLATES: ${{ secrets.NATIVE_QA_PRIVACY_TEMPLATES }}
        run: /usr/bin/python3 scripts/ci/image_privacy.py scan --list "$RUNNER_TEMP/image-privacy/slice" --directory "$RUNNER_TEMP/image-privacy" --jobs "$(nproc)" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/website.yml

  # Downloads each Linux package its release leg uploaded, once and by the
  # exact ID that leg handed on, and runs the full package verification on
  # those bytes, on the runner label they were built on. A job that needs its
  # uploader finds the artifact listed, which the uploading job itself may not
  # for a moment after its upload, so nothing here is attempted twice. Its legs
  # are the release legs of the platforms packages.py uploads. It builds
  # nothing and restores no cache: it runs no Rust toolchain or cache step, and
  # installs only the libraries and tools the checks run. Quality gate requires
  # its result and, for each Linux label, the pair of the release leg's answer
  # and this job's word (docs/ci-artifacts.md).
  package-transfer:
    needs: [changes, rust-release]
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.seed-only != 'true'
    name: Package transfer · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The limit only backs up a hung step. The installation's two commands end
    # within 300 s and 900 s, each with 10 s more to be stopped: 1,220 s. Inside
    # the release job the download took about 2 s and the checks about 12 s in
    # each Linux leg (Quality run 44667426966).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    # A leg's word under its own label: `verified`, which only the verification
    # writes, as its last act, or `held`, which the plan writes for a package
    # its release leg did not upload. As in rust-release, a leg leaves the
    # other label's value empty.
    outputs:
      linux-x86_64-transfer: ${{ steps.verify.outputs.linux-x86_64-transfer || steps.plan.outputs.linux-x86_64-transfer }}
      linux-aarch64-transfer: ${{ steps.verify.outputs.linux-aarch64-transfer || steps.plan.outputs.linux-aarch64-transfer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before any action reads them: an upload must come with an artifact ID
      # of at most fifteen digits without a leading zero and a whole SHA-256,
      # and a held package with neither. Anything else fails here, by name.
      - name: Read what the release leg handed on and refuse anything malformed
        id: plan
        env:
          RELEASE_OUTPUTS_JSON: ${{ toJSON(needs.rust-release.outputs) }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/ci/packages.py plan --target "$PACKAGE_TARGET" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      # The four libraries the executable links beside the C and GCC runtime,
      # and the package with the two desktop-entry commands the installer runs.
      # The helper reads the image's own Ubuntu source file alone, as the setup
      # action's install step does, and runs each command once under its deadline.
      - name: Install the runtime libraries and the desktop-entry tools
        if: steps.plan.outputs.verify == 'true'
        run: |
          python3 scripts/ci/apt_install.py \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -- \
            desktop-file-utils libdav1d7 libxcb1 libxkbcommon0 libxkbcommon-x11-0
      # One attempt, by the one validated ID: no name, pattern, run or token input.
      - name: Download the release leg's exact artifact from Actions
        id: download
        if: steps.plan.outputs.verify == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.plan.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-package-download
          merge-multiple: true
          digest-mismatch: error
      # Only after that one attempt failed: fixed words on what a red here is.
      - name: Say what a failed download is
        if: failure() && steps.download.outcome == 'failure'
        run: python3 scripts/ci/packages.py download-failed --summary "$GITHUB_STEP_SUMMARY"
      # The provenance is hashed before it is read and must be the one the
      # release leg handed on, of this job's own target, commit and run.
      - name: Verify downloaded bytes and installation
        id: verify
        if: steps.plan.outputs.verify == 'true'
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_REVISION: ${{ github.sha }}
          PACKAGE_RUN_ID: ${{ github.run_id }}
          PACKAGE_ATTEMPT: ${{ github.run_attempt }}
          PACKAGE_ARTIFACT_ID: ${{ steps.plan.outputs.artifact-id }}
          PACKAGE_PROVENANCE_SHA256: ${{ steps.plan.outputs.provenance-sha256 }}
        run: |
          python3 scripts/ci/metrics.py measure --name artifact-download-checks --directory "$RUNNER_TEMP/ci-metrics" -- \
            python3 scripts/ci/packages.py verify --directory "$RUNNER_TEMP/ci-package-download" \
              --expected-sha256 "$PACKAGE_PROVENANCE_SHA256" --target "$PACKAGE_TARGET" --revision "$PACKAGE_REVISION" \
              --run-id "$PACKAGE_RUN_ID" --attempt "$PACKAGE_ATTEMPT" --artifact-id "$PACKAGE_ARTIFACT_ID" \
              --report "$RUNNER_TEMP/ci-metrics/reports/package-transfer.json" --summary "$GITHUB_STEP_SUMMARY" \
              --output "$GITHUB_OUTPUT"
      - name: Summarize CI measurements
        if: always()
        run: python3 scripts/ci/metrics.py summary --directory "$RUNNER_TEMP/ci-metrics" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CI measurements and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

  quality:
    name: Quality gate
    if: always()
    needs: [changes, ci-tests, agent-tooling, rust-format, rust-debug, rust-clippy, rust-release, package-transfer, rust-arch, image-privacy, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every classified check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/changes.py gate
