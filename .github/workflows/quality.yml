# Disposable diagnostic branch only. Never merge this replacement workflow.
# The existing quality.yml on the default branch exposes workflow_dispatch;
# the coordinator may dispatch this reviewed branch explicitly with --ref.
name: Manual macOS icon compiler diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  icon-diagnostic:
    name: Icon diagnostic · Xcode ${{ matrix.xcode }} · ${{ matrix.method }}
    runs-on: macos-15
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - xcode: '26.3'
            method: direct
          - xcode: '26.3'
            method: wrapper
          - xcode: '26.2'
            method: direct
    env:
      ICON_XCODE: ${{ matrix.xcode }}
      ICON_METHOD: ${{ matrix.method }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe one exact icon compilation without retries
        run: |
          umask 077
          python3 scripts/ci/icon_diagnostic.py --xcode "$ICON_XCODE" --method "$ICON_METHOD" --directory "$RUNNER_TEMP/gitturtle-icon-diagnostic"
      - name: Preserve only diagnostic text and JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icon-diagnostic-${{ matrix.xcode }}-${{ matrix.method }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gitturtle-icon-diagnostic/evidence/*.json
            ${{ runner.temp }}/gitturtle-icon-diagnostic/evidence/*.log
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
