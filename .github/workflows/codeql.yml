name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:
    inputs:
      publish_results:
        description: Upload results; false runs a measurement rehearsal
        type: boolean
        default: false
      cold:
        description: Skip Rust extractor cache restoration for this measurement
        type: boolean
        default: false
      diagnostics:
        description: Enable additional CodeQL debug artifacts (separate timing sample)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    env:
      CODEQL_LANGUAGE: ${{ matrix.language }}
      CODEQL_PUBLISH_REQUESTED: ${{ inputs.publish_results }}
      CODEQL_COLD_REQUESTED: ${{ inputs.cold }}
      CODEQL_DIAGNOSTICS_REQUESTED: ${{ inputs.diagnostics }}
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - name: Set isolated extractor target for init and analysis
        run: printf 'CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR=%s/gitturtle-codeql-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate CodeQL tooling and workflow
        if: matrix.language == 'actions'
        run: |
          python3 -m unittest discover -s scripts/ci/tests -p 'test_codeql.py'
          python3 -m json.tool .github/codeql/config.yml > /dev/null
          actionlint_dir="$RUNNER_TEMP/codeql-actionlint-1.7.12"
          mkdir -p "$actionlint_dir"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$actionlint_dir/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" -shellcheck='' -pyflakes='' .github/workflows/codeql.yml
      - name: Resolve analysis and cache policy
        id: policy
        run: python3 scripts/ci/codeql.py policy --output "$GITHUB_OUTPUT"
      - name: Install Linux native extraction dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config git ca-certificates \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan-dev
          pkg-config --exists xkbcommon-x11 x11-xcb
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          # The same supported bundle as the measured baseline; update deliberately.
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.0/codeql-bundle-linux64.tar.zst
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/config.yml
          db-location: ${{ runner.temp }}/gitturtle-codeql-databases
          debug: ${{ inputs.diagnostics || false }}
          debug-artifact-name: codeql-debug-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record Rust extraction compatibility
        if: matrix.language == 'rust'
        id: context
        env:
          CODEQL_VERSION: ${{ steps.init.outputs.codeql-version }}
          CODEQL_BINARY: ${{ steps.init.outputs.codeql-path }}
        run: |
          python3 scripts/ci/codeql.py context \
            --directory "$RUNNER_TEMP/gitturtle-codeql-evidence" --output "$GITHUB_OUTPUT"
      - name: Restore trusted main extractor target
        if: matrix.language == 'rust' && steps.policy.outputs.restore == 'true'
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR }}
          key: ${{ steps.context.outputs.cache-key }}
          # No fallback crosses a changed compatibility input.
          enableCrossOsArchive: false
      - name: Analyze and process security results
        id: analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/gitturtle-codeql-sarif
          upload: ${{ steps.policy.outputs.upload }}
          upload-database: ${{ steps.policy.outputs.upload == 'always' }}
          wait-for-processing: true
      - name: Bound and record extractor cache candidate
        if: always() && matrix.language == 'rust' && steps.context.outcome == 'success'
        id: footprint
        env:
          CODEQL_CACHE_MATCH: ${{ steps.cache.outputs.cache-hit }}
          CODEQL_ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        run: |
          python3 scripts/ci/codeql.py footprint \
            --directory "$RUNNER_TEMP/gitturtle-codeql-evidence" --output "$GITHUB_OUTPUT"
      - name: Save successful trusted main extractor target
        if: success() && matrix.language == 'rust' && steps.policy.outputs.save == 'true' && steps.footprint.outputs.save-eligible == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR }}
          key: ${{ steps.context.outputs.cache-key }}
          enableCrossOsArchive: false
      - name: Preserve existing Rust coverage and extraction results
        if: always() && matrix.language == 'rust' && steps.init.outcome == 'success'
        env:
          CODEQL_BINARY: ${{ steps.init.outputs.codeql-path }}
        run: python3 scripts/ci/codeql.py capture --directory "$RUNNER_TEMP/gitturtle-codeql-evidence"
      - name: Preserve bounded Rust cache diagnostics
        if: always() && matrix.language == 'rust'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-context-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitturtle-codeql-evidence/*.json
          if-no-files-found: warn
          retention-days: 3
      - name: Record analysis mode
        if: always()
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          RESULT_UPLOAD: ${{ steps.policy.outputs.upload }}
        run: |
          python3 scripts/ci/codeql.py summary >> "$GITHUB_STEP_SUMMARY"
