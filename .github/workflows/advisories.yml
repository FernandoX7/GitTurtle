name: Dependency advisories

# RustSec publishes advisories against unchanged code, and GitHub's advisory
# database (and so Dependabot) can lag it by days or miss GHSA-only crate
# advisories, so the locked graph is checked daily as well as when dependency
# inputs change. This is not a required check: a new advisory turns this
# workflow red without blocking unrelated pull requests.
on:
  schedule:
    - cron: "23 7 * * *"
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .cargo/audit.toml
      - "vendor/**"
      - rust-toolchain.toml
      - .github/workflows/advisories.yml
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .cargo/audit.toml
      - "vendor/**"
      - rust-toolchain.toml
      - .github/workflows/advisories.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  cargo-deny:
    name: Advisories, licenses, bans and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny 0.21.0
        run: |
          deny_dir="$RUNNER_TEMP/cargo-deny-0.21.0"
          mkdir -p "$deny_dir"
          # One anonymous attempt over HTTPS only, on the first request and on every redirect; nothing
          # is retried. A failure ends the step with a line that names the host it happened on and the
          # status or curl's reason. The line takes the host alone: the release redirects to a URL
          # with a signed query, and neither the request's URL nor its query is printed.
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 \
            --write-out '%{onerror}%{stderr}::error::cargo-deny download failed at %{urle.host}: %{errormsg} (curl exit %{exitcode})\n' \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.21.0/cargo-deny-0.21.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$deny_dir/cargo-deny.tar.gz"
          # --status keeps the runner's path out of the log, so a wrong digest gets a line of its own:
          # a fixed one, without the fetched file's digest. Nothing is unpacked or run after it.
          printf '%s  %s\n' 'a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903' \
            "$deny_dir/cargo-deny.tar.gz" | sha256sum --check --status || {
            echo "::error::cargo-deny archive's SHA-256 is not the pinned one"
            exit 1
          }
          tar -xzf "$deny_dir/cargo-deny.tar.gz" -C "$deny_dir" --strip-components=1 \
            cargo-deny-0.21.0-x86_64-unknown-linux-musl/cargo-deny
          "$deny_dir/cargo-deny" --version
          printf '%s\n' "$deny_dir" >> "$GITHUB_PATH"
      # rustup installs the pinned toolchain from rust-toolchain.toml for the
      # metadata read; --locked refuses to rewrite Cargo.lock.
      - name: Check the locked graph against deny.toml and the RustSec database
        run: cargo-deny --locked check
