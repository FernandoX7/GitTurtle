name: Prepare pinned Rust and bounded compilation cache
description: Preserve native setup and restore dependency outputs; finish after all target consumers to bound successful main cache writes.
inputs:
  phase:
    description: setup before checks; finish after tests, lint, release and package consumers
    default: setup
  profile:
    description: Compatible Cargo output family (debug, release or debug-release)
    default: debug-release
  target:
    description: Explicit Cargo `--target` triple used by this job's compilation, if any
    default: ""
  vendor-reuse:
    description: true rewinds vendor/ source times so restored vendored outputs stay fresh (Quality only); release builds keep the default and compile vendored crates from source
    default: "false"
  container:
    description: archlinux when the job runs in the Arch Linux container, which installs its own packages and toolchain; the key then takes pacman versions instead of the runner's
    default: ""
  run-as:
    description: Unprivileged account that runs the helper and Cargo when the job starts as root (required with container); it must own the checkout
    default: ""
outputs:
  cache-hit:
    description: True only for an exact restored entry; false also includes fallback or unavailable cache
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Validate setup phase and profile
      shell: bash
      env:
        CACHE_PHASE: ${{ inputs.phase }}
        CACHE_PROFILE: ${{ inputs.profile }}
        CACHE_TARGET: ${{ inputs.target }}
        CACHE_VENDOR_REUSE: ${{ inputs.vendor-reuse }}
        CACHE_CONTAINER: ${{ inputs.container }}
        CACHE_RUN_AS: ${{ inputs.run-as }}
      run: |
        set -euo pipefail
        case "$CACHE_PHASE" in setup|finish) ;; *) exit 2 ;; esac
        case "$CACHE_VENDOR_REUSE" in true|false) ;; *) exit 2 ;; esac
        case "$CACHE_PROFILE" in debug|release|debug-release) ;; *) exit 2 ;; esac
        case "$CACHE_TARGET" in "") ;; [!A-Za-z0-9]*|*[!A-Za-z0-9_.-]*) exit 2 ;; esac
        case "$CACHE_CONTAINER" in ""|archlinux) ;; *) exit 2 ;; esac
        case "$CACHE_RUN_AS" in "") ;; [!a-z_]*|*[!a-z0-9_-]*) exit 2 ;; esac
        if [ -n "$CACHE_CONTAINER" ] && [ -z "$CACHE_RUN_AS" ]; then exit 2; fi
    - name: Install Linux native build dependencies
      if: inputs.phase == 'setup' && runner.os == 'Linux' && inputs.container == ''
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential clang cmake pkg-config git openssh-client ca-certificates \
          libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
          libssl-dev libzstd-dev libvulkan-dev \
          python3 python3-pil desktop-file-utils xdg-utils
        pkg-config --exists xkbcommon-x11 x11-xcb
    # A container job installs the toolchain as its build account first.
    - name: Install pinned workspace Rust toolchain
      if: inputs.phase == 'setup' && inputs.container == ''
      shell: bash
      run: |
        set -euo pipefail
        rustup show active-toolchain
        rustc --version
        cargo --version
    - name: Prepare cache identity and isolated Cargo storage
      if: inputs.phase == 'setup'
      shell: bash
      env:
        CACHE_PROFILE: ${{ inputs.profile }}
        CACHE_VENDOR_REUSE: ${{ inputs.vendor-reuse }}
        CACHE_CONTAINER: ${{ inputs.container }}
        CACHE_RUN_AS: ${{ inputs.run-as }}
      run: python3 .github/actions/setup-rust/cache.py prepare
    - name: Start cache restore observation
      if: inputs.phase == 'setup'
      shell: bash
      env:
        CACHE_RUN_AS: ${{ inputs.run-as }}
      run: python3 .github/actions/setup-rust/cache.py start
    - name: Restore Rust dependencies
      if: inputs.phase == 'setup'
      id: restore
      continue-on-error: true
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        prefix-key: gitturtle-rust-v2
        shared-key: ${{ env.CI_RUST_CACHE_KEY }}
        # Upstream keeps outputs only for packages whose manifest lies outside
        # this root. Rooting it at crates/ keeps registry and vendor/ path
        # packages and still drops the members; see docs/ci.md.
        workspaces: crates -> ../target
        cache-bin: false
        cache-workspace-crates: false
        cache-all-crates: false
        cache-on-failure: false
        save-if: false
        env-vars: SDKROOT MACOSX_DEPLOYMENT_TARGET PKG_CONFIG LIBRARY_PATH LDFLAGS AR
        # Upstream's rustc and cargo commands run as the build account too.
        cmd-format: ${{ inputs.run-as != '' && format('setpriv --reuid={0} --regid={0} --init-groups -- {{0}}', inputs.run-as) || '{0}' }}
    # Extraction runs as root, which keeps the archived owners: hand the
    # account everything under the two roots before anything reads them.
    - name: Give the build account the restored cache
      if: inputs.phase == 'setup' && inputs.run-as != ''
      shell: bash
      env:
        CACHE_RUN_AS: ${{ inputs.run-as }}
      run: |
        set -euo pipefail
        for root in "$CARGO_TARGET_DIR" "$CARGO_HOME"; do
          if [ -e "$root" ]; then chown -R -h -P -- "$CACHE_RUN_AS:$CACHE_RUN_AS" "$root"; fi
        done
    - name: Record restore and recover an unusable entry
      if: inputs.phase == 'setup'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        CACHE_OUTCOME: ${{ steps.restore.outcome }}
        CACHE_RUN_AS: ${{ inputs.run-as }}
      run: python3 .github/actions/setup-rust/cache.py restored
    - name: Bound dependency cache after successful validation
      if: inputs.phase == 'finish' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'FernandoX7/GitTurtle'
      id: bounded
      shell: bash
      env:
        CACHE_PROFILE: ${{ inputs.profile }}
        CACHE_TARGET: ${{ inputs.target }}
        CACHE_RUN_AS: ${{ inputs.run-as }}
      run: python3 .github/actions/setup-rust/cache.py bound
    - name: Register successful main cache save
      if: inputs.phase == 'finish' && steps.bounded.outputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'FernandoX7/GitTurtle'
      continue-on-error: true
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        prefix-key: gitturtle-rust-v2
        shared-key: ${{ env.CI_RUST_CACHE_KEY }}
        # Upstream keeps outputs only for packages whose manifest lies outside
        # this root. Rooting it at crates/ keeps registry and vendor/ path
        # packages and still drops the members; see docs/ci.md.
        workspaces: crates -> ../target
        cache-bin: false
        cache-workspace-crates: false
        cache-all-crates: false
        cache-on-failure: false
        lookup-only: true
        save-if: true
        env-vars: SDKROOT MACOSX_DEPLOYMENT_TARGET PKG_CONFIG LIBRARY_PATH LDFLAGS AR
        cmd-format: ${{ inputs.run-as != '' && format('setpriv --reuid={0} --regid={0} --init-groups -- {{0}}', inputs.run-as) || '{0}' }}
