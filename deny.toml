# cargo-deny policy for GitTurtle. `scripts/gate.py full` runs
# `cargo deny --format json check` as an advisory stage (blocking with
# --strict). The license allow list mirrors the dependency graph recorded in
# docs/licenses/dependencies.json and the full `cargo metadata` graph as of
# 2026-09-17; extend it deliberately when a new dependency arrives.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = false
exclude-dev = false

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities in any dependency are errors. Unmaintained advisories are
# reported only for crates the workspace depends on directly; the vendored
# toolkit's transitive font/SVG stack is tracked through vendor updates, not
# per candidate.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "bzip2-1.0.6",
    "PDDL-1.0",
]
# Crates published under an OR-expression that includes a copyleft option are
# used under their permissive alternative; cargo-deny picks the first
# satisfiable branch, so no exception is needed for those. Add an entry below
# only for a crate whose sole license is outside the allow list.
exceptions = []

[bans]
# The pinned toolkit stack carries duplicate image/SVG crate versions by
# design (recorded in vendor/AGENTS.md); duplicates are reviewed on vendor
# updates rather than per candidate.
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = [
    # Runtime Git/HTTP behavior must stay with the process-based git-core; a
    # linked libgit2 would bypass its passive-read policy.
    { crate = "git2" },
    { crate = "libgit2-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
