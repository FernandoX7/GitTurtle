[workspace]
members = [
    "crates/app",
    "crates/diff-model",
    "crates/git-core",
    "crates/github",
    "crates/prefs",
    "crates/preview",
    "crates/theme",
]
default-members = ["crates/app"]
exclude = ["fuzz", "vendor/gpui-pre-linux", "vendor/gpui-pre-macos", "vendor/gpui-pre-macros", "vendor/gpui-pre-wgpu", "vendor/mermaid-rs-renderer", "vendor/gpui-base", "vendor/gpui-component", "vendor/accesskit_atspi_common", "vendor/accesskit_macos", "vendor/accesskit_unix"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "allow"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
inefficient_to_string = "warn"
large_futures = "warn"
manual_let_else = "warn"
redundant_clone = "warn"
uninlined_format_args = "warn"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 8
strip = "debuginfo"

# Keep the matching GPUI Kit 0.10.0 / GPUI 0.3.12 stack; supply AccessKit's
# AT-SPI disabled state (#788) and off-screen/modal/teardown fixes under
# accesskit_unix 0.22, macOS VoiceOver off-screen clipping parity under
# accesskit_macos 0.26, AT-SPI cache signals libatspi accepts (#819, in
# accesskit_unix 0.24.1), Linux Wayland/X11/portal desktop integration &
# fractional-scale drawable sizing, macOS accessibility responder alignment,
# wgpu bounded GPU recovery & WGPU_BACKEND selection, a test-only
# #[gpui::test] teardown that releases each seed's app, and renderer
# font-cache / parser isolation for Mermaid.
[patch.crates-io]
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
accesskit_macos = { path = "vendor/accesskit_macos" }
accesskit_unix = { path = "vendor/accesskit_unix" }
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-macros = { path = "vendor/gpui-pre-macros" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }
