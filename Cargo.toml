[workspace]
members = ["crates/app", "crates/git-core", "crates/preview"]
default-members = ["crates/app"]
exclude = ["vendor/gpui-pre-macos", "vendor/mermaid-rs-renderer", "vendor/gpui-base"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 8
strip = "debuginfo"

# Keep the matching GPUI 0.3.4 stack; supply a demand-driven macOS frame wakeup.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }
