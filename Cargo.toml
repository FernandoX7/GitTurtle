[workspace]
members = ["crates/app", "crates/git-core", "crates/preview"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 8
strip = "debuginfo"
