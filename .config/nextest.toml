# cargo-nextest profiles for GitTurtle. Quality's tests step and
# `scripts/gate.py` run tests with `-P ci`; the defaults apply to interactive
# `cargo nextest run`. CI pins the nextest version in scripts/ci/tools.py.
# Reference: https://nexte.st/docs/configuration/reference/

[profile.default]
# A test that runs longer than a minute is reported as slow; after two periods
# it is terminated so a hung Git process or a parked GPUI task cannot stall the
# gate.
slow-timeout = { period = "60s", terminate-after = 2 }
# A test whose child process or thread still holds the output pipes shortly
# after it returns is reported as a leak instead of silently passing.
leak-timeout = "200ms"

[profile.ci]
inherits = "default"
fail-fast = false
retries = 0
failure-output = "immediate"
success-output = "never"
# One PASS, FAIL or SKIP line per test, so a CI log lists every executed and
# ignored test as `cargo test` did (scripts/ci/executed_tests.py compares them).
status-level = "skip"

# The Linux helper's evidence, printed on success too, so one hosted run's log
# carries it for each runner's architecture: the image client against the real
# binary under its filter (`/proc` status lines, dav1d's logged refusal, the
# helper's peak memory), libdav1d's ABI probe and the PDF helper's address
# space at confinement. Other targets compile these tests to nothing.
[[profile.ci.overrides]]
filter = 'binary(image_helper) | test(libdav1d_layouts_match_the_binding) | test(a_confined_helper_round_trips_a_page) | test(a_helper_started_under_an_outer_filter_round_trips_a_page)'
success-output = "immediate"

[profile.ci.junit]
path = "junit.xml"

[profile.mutants]
inherits = "ci"
